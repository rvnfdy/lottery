<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spin Wheel Lottery</title>
<style>
  :root {
    --bg: #f4f5fb; --card: #fff; --text: #1f2430; --muted: #6b7280;
    --accent: #6c5ce7; --accent-dark: #5848d6; --danger: #e5484d; --border: #e3e5ee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px 16px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { text-align: center; margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 16px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } .wheel-card { order: -1; } }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
  h2 { font-size: 1rem; margin: 0 0 12px; }
  .row { display: flex; gap: 8px; }
  input[type=text], textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    font: inherit; background: #fff; color: var(--text);
  }
  textarea { resize: vertical; min-height: 70px; margin-top: 8px; }
  button {
    font: inherit; border: 0; border-radius: 8px; padding: 10px 14px; cursor: pointer;
    background: var(--accent); color: #fff; font-weight: 600; white-space: nowrap;
  }
  button:hover { background: var(--accent-dark); }
  button.ghost { background: #eceefa; color: var(--text); }
  button.ghost:hover { background: #dfe2f5; }
  button.danger { background: var(--danger); }
  button.danger:hover { background: #c93a3f; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  ul { list-style: none; padding: 0; margin: 12px 0 0; max-height: 300px; overflow-y: auto; }
  li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 10px; border-bottom: 1px solid var(--border); gap: 8px;
  }
  li span { word-break: break-word; }
  li button { padding: 4px 9px; background: transparent; color: var(--danger); font-size: 1.1rem; }
  li button:hover { background: #fdecec; }
  .muted { color: var(--muted); font-size: .85rem; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }

  .wheel-card { text-align: center; }
  .wheel-box { position: relative; width: 100%; max-width: 480px; margin: 0 auto; aspect-ratio: 1; }
  canvas { width: 100%; height: 100%; display: block; }
  .pointer {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%); z-index: 2;
    width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent;
    border-top: 34px solid #1f2430; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35));
  }
  .hub {
    position: absolute; top: 50%; left: 50%; width: 64px; height: 64px; transform: translate(-50%, -50%);
    border-radius: 50%; background: #fff; border: 4px solid #1f2430; z-index: 2;
    display: flex; align-items: center; justify-content: center; font-size: 1.4rem;
  }
  .result {
    min-height: 56px; margin: 14px 0 4px; font-size: 1.6rem; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .result .chip { background: var(--accent); color: #fff; border-radius: 999px; padding: 8px 22px; animation: pop .4s ease; word-break: break-word; }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .spin-btn { font-size: 1.15rem; padding: 12px 32px; }
  .toggle { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; font-size: .9rem; }
  .history li { font-size: .9rem; }
  .full { grid-column: 1 / -1; }
  .range-box { margin-top: 14px; padding: 12px; background: #f7f7fd; border: 1px solid var(--border); border-radius: 10px; }
  .range-box h3 { margin: 0 0 8px; font-size: .9rem; }
  .range-row { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
  .range-row label { display: flex; flex-direction: column; font-size: .78rem; color: var(--muted); gap: 3px; flex: 1; min-width: 60px; }
  .range-row input[type=number] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font: inherit; background: #fff; color: var(--text);
  }
  .check { display: flex; align-items: center; gap: 6px; font-size: .85rem; margin-top: 8px; }
  .speed { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 14px; font-size: .9rem; }
  .speed input[type=range] { width: 180px; accent-color: var(--accent); }
  .speed output { min-width: 56px; text-align: left; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎡 Spin Wheel Lottery</h1>
  <div class="grid">
    <div class="card">
      <h2>Participants (<span id="count">0</span>)</h2>
      <div class="row">
        <input type="text" id="nameInput" placeholder="Add a name and press Enter">
        <button id="addBtn">Add</button>
      </div>
      <textarea id="bulk" placeholder="Or paste many names (one per line / comma separated)"></textarea>
      <div class="actions">
        <button class="ghost" id="bulkBtn">Add pasted names</button>
      </div>
      <div class="range-box">
        <h3>🔢 Number generator</h3>
        <div class="range-row">
          <label>From <input type="number" id="rFrom" value="1"></label>
          <label>To <input type="number" id="rTo" value="20"></label>
          <label>Step <input type="number" id="rStep" value="1" min="0.0001" step="any"></label>
          <button id="rangeBtn">Add range</button>
        </div>
        <label class="check"><input type="checkbox" id="rReplace" checked> Replace the current list</label>
        <div class="muted" id="rangeMsg" style="margin-top:6px"></div>
      </div>
      <ul id="list"></ul>
      <div class="actions"><button class="danger" id="clearBtn">🗑 Delete all participants</button></div>
    </div>

    <div class="card wheel-card">
      <div class="wheel-box">
        <div class="pointer"></div>
        <canvas id="wheel" width="800" height="800"></canvas>
        <div class="hub">🎟️</div>
      </div>
      <div class="result" id="result"><span class="muted">Add names, then spin the wheel</span></div>
      <button class="spin-btn" id="spinBtn">🎲 SPIN!</button>
      <div class="speed">
        <label for="speed">🐢 Spin speed 🐇</label>
        <input type="range" id="speed" min="1" max="5" step="1" value="3">
        <output id="speedOut">Normal</output>
      </div>
      <label class="toggle">
        <input type="checkbox" id="autoRemove" checked>
        Remove winner from the list after each round
      </label>
      <div class="actions" style="justify-content:center">
        <button class="ghost" id="undoBtn" disabled>↩ Restore last winner</button>
        <button class="ghost" id="shuffleBtn">🔀 Shuffle order</button>
      </div>
    </div>

    <div class="card full">
      <h2>Past rounds</h2>
      <ul class="history" id="history"><li class="muted">No rounds yet.</li></ul>
      <div class="actions"><button class="ghost" id="clearHistory">Clear history</button></div>
    </div>
  </div>
</div>

<script>
(function () {
  const KEY = 'spin-lottery-v1';
  const COLORS = ['#6c5ce7', '#00b894', '#fdcb6e', '#e17055', '#0984e3', '#e84393', '#00cec9', '#d63031', '#a29bfe', '#55efc4'];
  const TAU = Math.PI * 2;
  let names = [], rounds = [], last = null; // last = {name, index}
  let rot = 0, spinning = false;
  let speed = 3; // 1 (slowest) .. 5 (fastest)
  const DURATIONS = [10000, 7500, 5500, 3500, 2000];
  const SPEED_LABELS = ['Very slow', 'Slow', 'Normal', 'Fast', 'Very fast'];

  const $ = id => document.getElementById(id);
  const canvas = $('wheel'), ctx = canvas.getContext('2d');
  const listEl = $('list'), historyEl = $('history'), resultEl = $('result');

  function save() { try { localStorage.setItem(KEY, JSON.stringify({ names, rounds, speed })); } catch (e) {} }
  function load() {
    try {
      const d = JSON.parse(localStorage.getItem(KEY) || '{}');
      names = d.names || []; rounds = d.rounds || [];
      if (d.speed >= 1 && d.speed <= 5) speed = d.speed;
    } catch (e) {}
    $('speed').value = speed; $('speedOut').textContent = SPEED_LABELS[speed - 1];
  }

  function drawWheel() {
    const W = canvas.width, R = W / 2 - 8, c = W / 2;
    ctx.clearRect(0, 0, W, W);
    ctx.save();
    ctx.translate(c, c);

    if (!names.length) {
      ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.fillStyle = '#dfe2ee'; ctx.fill();
      ctx.fillStyle = '#6b7280'; ctx.font = 'bold 36px system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('Add names', 0, 0);
      ctx.restore(); return;
    }

    const n = names.length, seg = TAU / n;
    ctx.rotate(rot);
    for (let i = 0; i < n; i++) {
      const a0 = i * seg, a1 = a0 + seg;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, a0, a1); ctx.closePath();
      let color = COLORS[i % COLORS.length];
      if (n > 1 && i === n - 1 && i % COLORS.length === 0) color = '#74b9ff'; // avoid same colour touching at the seam
      ctx.fillStyle = color; ctx.fill();
      if (n > 1) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke(); }

      // label
      const px = seg * R * 0.5; // approx arc width available mid-radius
      if (n <= 60) {
        ctx.save();
        ctx.rotate(a0 + seg / 2);
        ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        ctx.fillStyle = '#fff';
        const fs = Math.max(11, Math.min(34, px * 0.55));
        ctx.font = 'bold ' + fs + 'px system-ui, sans-serif';
        ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 3;
        let t = names[i];
        const maxW = R * 0.72;
        while (t.length > 1 && ctx.measureText(t).width > maxW) t = t.slice(0, -1);
        if (t !== names[i]) t = t.slice(0, -1) + '…';
        ctx.fillText(t, R - 24, 0);
        ctx.restore();
      }
    }
    ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.lineWidth = 8; ctx.strokeStyle = '#1f2430'; ctx.stroke();
    ctx.restore();
  }

  function render() {
    $('count').textContent = names.length;
    listEl.innerHTML = '';
    if (!names.length) listEl.innerHTML = '<li class="muted">The list is empty.</li>';
    names.forEach((n, i) => {
      const li = document.createElement('li');
      const s = document.createElement('span'); s.textContent = n;
      const b = document.createElement('button'); b.textContent = '✕'; b.title = 'Remove';
      b.disabled = spinning;
      b.onclick = () => { names.splice(i, 1); render(); save(); };
      li.append(s, b); listEl.appendChild(li);
    });
    $('spinBtn').disabled = spinning || names.length === 0;
    $('undoBtn').disabled = spinning || !last;
    $('shuffleBtn').disabled = spinning || names.length < 2;

    historyEl.innerHTML = '';
    if (!rounds.length) historyEl.innerHTML = '<li class="muted">No rounds yet.</li>';
    rounds.forEach((r, i) => {
      const li = document.createElement('li');
      li.textContent = 'Round ' + (i + 1) + ': ' + r;
      historyEl.appendChild(li);
    });
    drawWheel();
  }

  function addNames(arr) {
    arr.map(s => s.trim()).filter(Boolean).forEach(n => names.push(n));
    render(); save();
  }

  function randInt(max) {
    const buf = new Uint32Array(1); crypto.getRandomValues(buf); return buf[0] % max;
  }
  function randFloat() {
    const buf = new Uint32Array(1); crypto.getRandomValues(buf); return buf[0] / 4294967296;
  }

  const easeOut = t => 1 - Math.pow(1 - t, 4);

  function spin() {
    if (spinning || !names.length) return;
    spinning = true; resultEl.innerHTML = '<span class="muted">Spinning…</span>';
    render();

    const n = names.length, seg = TAU / n;
    const winner = randInt(n);
    // Pointer is at the top (angle -PI/2). Segment i spans [rot + i*seg, rot + (i+1)*seg].
    const offset = (randFloat() - 0.5) * seg * 0.8; // land somewhere inside the segment, not on the edge
    const target = -Math.PI / 2 - (winner + 0.5) * seg + offset;
    let delta = ((target - rot) % TAU + TAU) % TAU;
    const dur = DURATIONS[speed - 1];
    const spins = Math.max(2, Math.round(dur / 1000)) + randInt(3); // faster setting = fewer full turns
    const total = delta + spins * TAU;
    const start = rot, t0 = performance.now();

    function frame(now) {
      const t = Math.min(1, (now - t0) / dur);
      rot = start + total * easeOut(t);
      drawWheel();
      if (t < 1) requestAnimationFrame(frame);
      else finish(winner);
    }
    requestAnimationFrame(frame);
  }

  function finish(idx) {
    rot = ((rot % TAU) + TAU) % TAU;
    const name = names[idx];
    spinning = false;
    resultEl.innerHTML = '';
    const chip = document.createElement('div'); chip.className = 'chip'; chip.textContent = '🏆 ' + name;
    resultEl.appendChild(chip);
    rounds.push(name);
    if ($('autoRemove').checked) { names.splice(idx, 1); last = { name, index: idx }; }
    else last = null;
    render(); save();
  }

  $('addBtn').onclick = () => { addNames([$('nameInput').value]); $('nameInput').value = ''; $('nameInput').focus(); };
  $('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('addBtn').click(); });
  $('bulkBtn').onclick = () => { addNames($('bulk').value.split(/[\n,]+/)); $('bulk').value = ''; };
  $('clearBtn').onclick = () => {
    if (spinning || !names.length) return;
    const btn = $('clearBtn');
    // Two-step confirm without confirm(): native dialogs are blocked in some previews
    if (!btn.dataset.armed) {
      btn.dataset.armed = '1';
      btn.textContent = '⚠ Click again to delete all ' + names.length;
      clearTimeout(btn._t);
      btn._t = setTimeout(resetClearBtn, 4000);
      return;
    }
    resetClearBtn();
    names = []; last = null;
    resultEl.innerHTML = '<span class="muted">Add names, then spin the wheel</span>';
    render(); save();
  };
  function resetClearBtn() {
    const btn = $('clearBtn');
    delete btn.dataset.armed; clearTimeout(btn._t);
    btn.textContent = '🗑 Delete all participants';
  }
  $('speed').oninput = e => {
    speed = parseInt(e.target.value); $('speedOut').textContent = SPEED_LABELS[speed - 1]; save();
  };

  $('rangeBtn').onclick = () => {
    if (spinning) return;
    const msg = $('rangeMsg');
    const from = parseFloat($('rFrom').value), to = parseFloat($('rTo').value);
    let step = Math.abs(parseFloat($('rStep').value));
    if (isNaN(from) || isNaN(to)) { msg.textContent = 'Enter a valid From and To.'; return; }
    if (!step || isNaN(step)) step = 1;
    const count = Math.floor(Math.abs(to - from) / step + 1e-9) + 1;
    if (count > 500) { msg.textContent = 'That would make ' + count + ' entries — the limit is 500.'; return; }
    const dec = Math.max(0, ...[from, step].map(v => (String(v).split('.')[1] || '').length));
    const dir = to >= from ? 1 : -1;
    const out = [];
    for (let i = 0; i < count; i++) out.push((from + dir * step * i).toFixed(dec));
    if ($('rReplace').checked) { names = []; last = null; }
    names.push(...out);
    msg.textContent = 'Added ' + out.length + ' numbers (' + out[0] + ' to ' + out[out.length - 1] + ').';
    render(); save();
  };
  $('spinBtn').onclick = spin;
  canvas.onclick = spin;
  $('undoBtn').onclick = () => {
    if (!last) return;
    names.splice(Math.min(last.index, names.length), 0, last.name);
    rounds.pop(); last = null; resultEl.innerHTML = '<span class="muted">Winner restored</span>';
    render(); save();
  };
  $('shuffleBtn').onclick = () => {
    for (let i = names.length - 1; i > 0; i--) { const j = randInt(i + 1); [names[i], names[j]] = [names[j], names[i]]; }
    render(); save();
  };
  $('clearHistory').onclick = () => { rounds = []; render(); save(); };

  load(); render();
})();
</script>
</body>
</html>
